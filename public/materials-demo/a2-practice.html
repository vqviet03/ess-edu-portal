<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phiếu ôn tập A2</title><style>body{font:16px/1.8 Arial,sans-serif;max-width:760px;margin:40px auto;padding:0 24px;color:#18382c}h1{font-size:28px}li{margin:12px 0}.note{background:#eff8f0;padding:16px;border-radius:12px}</style><h1>Phiếu ôn tập A2</h1><p class="note">Tài liệu minh họa của lớp A2. Nội dung chính thức sẽ do giáo viên cung cấp qua hệ thống.</p><h2>Hoạt động luyện tập</h2><ol><li>Giới thiệu bản thân bằng 5 câu tiếng Anh.</li><li>Kể về thói quen hàng ngày của em.</li><li>Mô tả một địa điểm em yêu thích.</li><li>Viết đoạn hội thoại ngắn để hỏi đường.</li></ol></html>
